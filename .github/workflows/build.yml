name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Optional: a stable signing key so new builds install over old ones.
      # Add repo secrets OPENBLUE_KEYSTORE_B64 (base64 of a .jks) and
      # OPENBLUE_KEYSTORE_PASSWORD. Without them the build uses a throwaway debug key.
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.OPENBLUE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/openblue.jks"
            echo "OPENBLUE_KEYSTORE=$RUNNER_TEMP/openblue.jks" >> "$GITHUB_ENV"
            echo "Using stable signing key"
          else
            echo "::warning::No signing key secret set; APK is signed with a throwaway debug key (updates will need an uninstall first)."
          fi

      - name: Build
        env:
          OPENBLUE_KEYSTORE_PASSWORD: ${{ secrets.OPENBLUE_KEYSTORE_PASSWORD }}
        # On failure, surface compiler errors as annotations (readable without downloading logs).
        run: |
          set -o pipefail
          if ! gradle --no-daemon assembleRelease 2>&1 | tee build.log; then
            grep -E "^e: |^w: .*error|What went wrong|^> |Could not|error:" build.log | grep -v "^> Task" | head -60 > errors.txt || true
            split -l 12 errors.txt chunk_
            for f in chunk_*; do
              msg=$(sed -e 's/%/%25/g' "$f" | sed -e ':a;N;$!ba;s/\n/%0A/g')
              echo "::error title=Build error::$msg"
            done
            exit 1
          fi

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk OpenBlue.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OpenBlue-apk
          path: OpenBlue.apk

      # Publish to a rolling "latest" release so the APK can be downloaded on the phone directly.
      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest OpenBlue.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build (${GITHUB_SHA::7})" \
            --notes "Built from ${GITHUB_SHA} by run #${GITHUB_RUN_NUMBER}. Download OpenBlue.apk on your phone to install."
