name: Build APK

on:
  push:
    branches: [main, staging-changes]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging-changes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # the FMOD bridge (app/src/main/cpp) builds with whichever NDK the runner has
      - name: Pick the installed NDK
        run: echo "OPENBLUE_NDK_VERSION=$(ls "$ANDROID_HOME/ndk" | sort -V | tail -1)" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Optional: a stable signing key so new builds install over old ones.
      # Add repo secrets OPENBLUE_KEYSTORE_B64 (base64 of a .jks) and
      # OPENBLUE_KEYSTORE_PASSWORD. Without them the build uses a throwaway debug key.
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.OPENBLUE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.OPENBLUE_KEYSTORE_PASSWORD }}
        run: |
          if [ "$GITHUB_REF_NAME" = staging-changes ] && { [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; }; then
            echo "::error::Staging builds require the existing release signing key and password."
            exit 1
          fi
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/openblue.jks"
            echo "OPENBLUE_KEYSTORE=$RUNNER_TEMP/openblue.jks" >> "$GITHUB_ENV"
            echo "Using stable signing key"
          else
            echo "::warning::No signing key secret set; APK is signed with a throwaway debug key (updates will need an uninstall first)."
          fi

      - name: Build
        env:
          OPENBLUE_KEYSTORE_PASSWORD: ${{ secrets.OPENBLUE_KEYSTORE_PASSWORD }}
          OPENBLUE_UPDATE_CHANNEL: ${{ github.ref_name == 'staging-changes' && 'staging-changes' || 'public' }}
        run: .github/scripts/gradle.sh assembleRelease

      - name: Test staging build
        if: github.ref == 'refs/heads/staging-changes'
        env:
          OPENBLUE_UPDATE_CHANNEL: staging-changes
        run: .github/scripts/gradle.sh :app:testDebugUnitTest

      - name: Collect APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk OpenBlue.apk
          # What the app's updater reads to decide whether there's something newer.
          version="0.1.$GITHUB_RUN_NUMBER"
          if [ "$GITHUB_REF_NAME" = staging-changes ]; then version="$version-staging"; fi
          jq -n --argjson code "$GITHUB_RUN_NUMBER" --arg name "$version" --arg commit "$GITHUB_SHA" \
            --arg message "$(git log -1 --format=%s)" --arg sha "$(sha256sum OpenBlue.apk | cut -d' ' -f1)" \
            --argjson size "$(stat -c %s OpenBlue.apk)" \
            '{versionCode: $code, versionName: $name, commit: $commit, message: $message, sha256: $sha, size: $size}' > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: OpenBlue-apk
          path: OpenBlue.apk

      # Staging uses its own tag and never touches the public latest release.
      - name: Publish channel release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_NAME" = staging-changes ]; then
            tag=staging-changes
            title="Staging build (${GITHUB_SHA::7})"
          else
            tag=latest
            title="Latest build (${GITHUB_SHA::7})"
          fi
          gh release delete "$tag" --cleanup-tag -y || true
          gh release create "$tag" OpenBlue.apk version.json \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA} by run #${GITHUB_RUN_NUMBER}. Download OpenBlue.apk on your phone to install."

  # Renders every screen with demo data and publishes the PNGs to the `screenshots` branch.
  screenshots:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # the FMOD bridge (app/src/main/cpp) builds with whichever NDK the runner has
      - name: Pick the installed NDK
        run: echo "OPENBLUE_NDK_VERSION=$(ls "$ANDROID_HOME/ndk" | sort -V | tail -1)" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Record screenshots
        run: .github/scripts/gradle.sh :app:recordPaparazziDebug

      - name: Publish to screenshots branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          cp app/src/test/snapshots/images/*.png out/
          cd out
          git init -q
          git checkout -q -b screenshots
          git add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screenshots
